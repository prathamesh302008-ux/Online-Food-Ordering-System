{% extends 'base.html' %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">

My Profile

</h2>

<table class="table table-bordered">

<tr>

<th>Username</th>

<td>{{ user.username }}</td>

</tr>

<tr>

<th>First Name</th>

<td>{{ user.first_name }}</td>

</tr>

<tr>

<th>Last Name</th>

<td>{{ user.last_name }}</td>

</tr>

<tr>

<th>Email</th>

<td>{{ user.email }}</td>

</tr>

<tr>

<th>Date Joined</th>

<td>{{ user.date_joined }}</td>

</tr>

</table>

<div class="mt-4">

<a
href="/accounts/logout/"
class="btn btn-danger">

Logout

</a>

</div>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
